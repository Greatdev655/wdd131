<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for customers to submit their feedback and ratings on purchased products.">
    <meta name="author" content="Ikechukwu Great">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <title> Product review form</title>
</head>
<body>

    <header>
        <h1> PRODUCT REVIEW FORM</h1>
    </header>

    <main>
        <div class="form_container">
            <form action="review.html" method="get">
            <h3 class="product_name">Product Name : </h3>
            <select name="product" id="product" required>
                <option value="" selected disabled> Select a product </option>
                <!-- Options will be populated by JavaScript -->
            </select>   
            
                <!-- Star Rating -->

               <div class="star_rating">
                    <h3>Rating :</h3>
                    <div class="stars">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5" title="5 stars">&#9733;</label>

                        <input type="radio" id="star4" name="rating" value="4">
                        <label for="star4" title="4 stars">&#9733;</label>

                        <input type="radio" id="star3" name="rating" value="3">
                        <label for="star3" title="3 stars">&#9733;</label>

                        <input type="radio" id="star2" name="rating" value="2">
                        <label for="star2" title="2 stars">&#9733;</label>

                        <input type="radio" id="star1" name="rating" value="1">
                        <label for="star1" title="1 star">&#9733;</label>
                    </div>
                </div>

                <!-- Date installation  --> 

                <div class="date">
                    <h3>Date of Installation : </h3>
                    <input type="date" name="installation_date" required>
                </div>

                <!--  Useful features  -->
                <div class="useful_features">
                    <h3>Useful Features : </h3>
                    <label><input type="checkbox" name="features" value="feature1"> Durability</label>
                    <label><input type="checkbox" name="features" value="feature2"> Easy to Use</label>
                    <label><input type="checkbox" name="features" value="feature3"> Affordability</label>
                    <label><input type="checkbox" name="features" value="feature4" id="check"> Design</label>
                </div>


                <!-- Written Review -->

                <div class="written_review">
                    <h3> Written Review  <span>(Optional)</span></h3>
                    <textarea name="review" id="text_area" placeholder="Write your review here...(optional)" ></textarea>
                </div>

                <!-- user name  -->
                <div class="user_name">
                    <h3>Your Name : </h3>
                    <input type="text" name="user_name" required>
                </div>

                <button type="submit" id="submit-btn">Submit Review</button>
            </form>

        </div>
    </main>

    <footer>
        <p>
        Copyright © <span id="current-year"></span> Ikechukwu Great. All rights
        reserved. Last modified <span id="lastModified"></span>
        </p>
        &nbsp;
    </footer>
    
</body>
</html>
